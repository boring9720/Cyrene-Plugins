<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>聊天记录导出</title>
<style>
  :root {
    --bg: #f6f4f7; --card: #ffffff;
    --ink: #2d2a31; --ink-soft: #8a8592; --ink-faint: #b5b0bd;
    --primary: #d95f8a; --primary-deep: #c04a73; --primary-soft: #fdf1f5;
    --edge: #e8e4ec; --danger: #c0564f;
    --tag-chat: #e3f2fd; --tag-chat-ink: #3d6f9e;
    --tag-code: #e8f2e8; --tag-code-ink: #4e7a4e;
    --tag-work: #fdf3e0; --tag-work-ink: #a0763a;
    --tag-learn: #eee8f2; --tag-learn-ink: #6d6879;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  /* 顶部说明区：无边框窗口的拖动区 */
  .head {
    padding: 16px 20px 14px; background: var(--card); border-bottom: 1px solid var(--edge);
    display: flex; align-items: flex-start; gap: 12px;
    -webkit-app-region: drag;
  }
  .head-text { flex: 1; min-width: 0; }
  .head h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .head p { font-size: 12px; color: var(--ink-soft); }

  /* 内置关闭按钮：CSS 绘制的叉号，悬停变红 */
  .btn-close {
    -webkit-app-region: no-drag;
    width: 28px; height: 28px; flex-shrink: 0; margin-top: 2px;
    border: none; border-radius: 8px; background: transparent;
    cursor: pointer; position: relative;
  }
  .btn-close::before, .btn-close::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 13px; height: 1.5px; border-radius: 1px;
    background: var(--ink-soft); transition: background .12s;
  }
  .btn-close::before { transform: translate(-50%, -50%) rotate(45deg); }
  .btn-close::after { transform: translate(-50%, -50%) rotate(-45deg); }
  .btn-close:hover { background: #fdeaea; }
  .btn-close:hover::before, .btn-close:hover::after { background: var(--danger); }
  .btn-close:active { background: #f8d8d6; }

  /* 搜索与全选 */
  .toolbar { display: flex; gap: 8px; padding: 12px 20px 8px; align-items: center; }
  .search { flex: 1; position: relative; }
  .search input {
    width: 100%; height: 34px; border: 1px solid var(--edge); border-radius: 8px;
    background: var(--card); padding: 0 12px; font-size: 13px; color: var(--ink); outline: none;
    -webkit-user-select: text; user-select: text;
  }
  .search input:focus { border-color: var(--primary); }
  .search input::placeholder { color: var(--ink-faint); }
  .btn-ghost {
    height: 34px; padding: 0 14px; border: 1px solid var(--edge); border-radius: 8px;
    background: var(--card); font-size: 13px; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-ghost:disabled { opacity: .5; cursor: default; }

  /* 会话列表 */
  .list { flex: 1; overflow-y: auto; padding: 4px 20px 12px; }
  .session {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--card); border: 1px solid var(--edge); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    transition: border-color .12s;
  }
  .session:hover { border-color: var(--primary); }
  .session input[type="checkbox"] { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
  .session-main { flex: 1; min-width: 0; }
  .session-title { font-size: 14px; font-weight: 500; word-break: break-all; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .session-sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .session-sub .ws { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  }
  .tag-chat { background: var(--tag-chat); color: var(--tag-chat-ink); }
  .tag-code { background: var(--tag-code); color: var(--tag-code-ink); }
  .tag-work { background: var(--tag-work); color: var(--tag-work-ink); }
  .tag-learn { background: var(--tag-learn); color: var(--tag-learn-ink); }
  .tag-proactive { background: var(--primary-soft); color: var(--primary-deep); }

  /* 空态 / 加载态 */
  .state { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 60px 20px; }
  .state.error { color: var(--danger); white-space: pre-wrap; -webkit-user-select: text; user-select: text; }

  /* 底部操作栏 */
  .foot {
    background: var(--card); border-top: 1px solid var(--edge);
    padding: 12px 20px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .foot-row { display: flex; align-items: center; gap: 18px; }
  .format { display: flex; align-items: center; gap: 16px; font-size: 13px; }
  .format label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .format input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }
  .foot-note { font-size: 12px; color: var(--ink-faint); margin-left: auto; }
  .btn-primary {
    height: 38px; padding: 0 26px; border: none; border-radius: 9px;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .btn-primary:hover { background: var(--primary-deep); }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  /* 导出结果 */
  .result { font-size: 12px; border-radius: 10px; padding: 10px 12px; max-height: 130px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .result.ok { background: #f0f7f1; color: #3f6b4b; }
  .result.err { background: #fdf0ef; color: var(--danger); }
  .result .file { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .result .file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result .file button {
    border: none; background: none; color: var(--primary-deep); font-size: 12px; cursor: pointer; flex-shrink: 0; padding: 0;
  }
  .result .file button:hover { text-decoration: underline; }
</style>
</head>
<body>

<header class="head">
  <div class="head-text">
    <h1>聊天记录导出</h1>
    <p>勾选会话并导出为可读文件，对本地存档只读不改；图片附件将内嵌进 HTML 文件</p>
  </div>
  <button id="closeBtn" class="btn-close" title="关闭"></button>
</header>

<div class="toolbar">
  <div class="search"><input id="search" type="text" placeholder="搜索会话标题…"></div>
  <button id="checkAll" class="btn-ghost" disabled>全选</button>
</div>

<div class="list" id="list"><div class="state">正在读取聊天存档…</div></div>

<footer class="foot">
  <div id="result"></div>
  <div class="foot-row">
    <div class="format" id="formats">
      <label><input type="checkbox" id="fmtHtml" checked>HTML</label>
      <label><input type="checkbox" id="fmtMd">Markdown</label>
    </div>
    <span class="foot-note" id="note"></span>
    <button id="exportBtn" class="btn-primary" disabled>导出所选会话</button>
  </div>
</footer>

<script>
  const { ipcRenderer, shell } = require("electron");
  // 插件 IPC 统一走宿主分配的命名空间前缀
  const invoke = (channel, payload) => ipcRenderer.invoke("plugin:chat-export:" + channel, payload);

  // 内置关闭按钮：关掉插件窗口
  document.getElementById("closeBtn").addEventListener("click", () => window.close());

  const listEl = document.getElementById("list");
  const searchEl = document.getElementById("search");
  const checkAllEl = document.getElementById("checkAll");
  const exportBtn = document.getElementById("exportBtn");
  const fmtHtmlEl = document.getElementById("fmtHtml");
  const fmtMdEl = document.getElementById("fmtMd");
  const noteEl = document.getElementById("note");
  const resultEl = document.getElementById("result");

  /** 全部会话（来自存档索引） */
  let sessions = [];
  /** 已勾选的会话 id 集合（跨搜索保持勾选） */
  const selected = new Set();
  let exporting = false;

  function tagClass(mode) {
    if (mode === "编程") return "tag-code";
    if (mode === "工作") return "tag-work";
    if (mode === "学习") return "tag-learn";
    return "tag-chat";
  }

  function formatTime(ms) {
    if (!Number.isFinite(ms)) return "";
    const d = new Date(ms);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderList() {
    const keyword = searchEl.value.trim().toLowerCase();
    const visible = sessions.filter((s) => s.title.toLowerCase().includes(keyword));
    if (visible.length === 0) {
      listEl.innerHTML = sessions.length === 0
        ? '<div class="state">没有找到聊天会话</div>'
        : '<div class="state">没有匹配的会话</div>';
    } else {
      listEl.innerHTML = visible.map((s) => {
        const checked = selected.has(s.id) ? "checked" : "";
        const tags = [
          `<span class="tag ${tagClass(s.mode)}">${s.mode}</span>`,
          s.purpose ? `<span class="tag tag-proactive">${s.purpose}</span>` : "",
        ].join("");
        const sub = [
          `<span>${s.messageCount} 条消息</span>`,
          `<span>${formatTime(s.updatedAt)}</span>`,
          s.workspace ? `<span class="ws" title="${s.workspace}">${s.workspace}</span>` : "",
        ].join("");
        return `<div class="session" data-id="${s.id}">
          <input type="checkbox" ${checked}>
          <div class="session-main">
            <div class="session-title"><span>${s.title.replace(/</g, "&lt;")}</span>${tags}</div>
            <div class="session-sub">${sub}</div>
          </div>
        </div>`;
      }).join("");
    }
    checkAllEl.disabled = sessions.length === 0;
    checkAllEl.textContent = visible.length > 0 && visible.every((s) => selected.has(s.id)) ? "取消全选" : "全选";
    refreshFoot();
  }

  function refreshFoot() {
    const hasFormat = fmtHtmlEl.checked || fmtMdEl.checked;
    exportBtn.disabled = exporting || selected.size === 0 || !hasFormat;
    exportBtn.textContent = exporting ? "正在导出…" : `导出所选会话（${selected.size}）`;
    noteEl.textContent = "";
  }

  // 列表点击：整行或复选框都能切换勾选
  listEl.addEventListener("click", (event) => {
    const row = event.target.closest(".session");
    if (!row) return;
    const id = row.dataset.id;
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);
    row.querySelector('input[type="checkbox"]').checked = selected.has(id);
    refreshFoot();
  });

  searchEl.addEventListener("input", renderList);

  // 全选/取消全选只作用于当前搜索可见的会话
  checkAllEl.addEventListener("click", () => {
    const keyword = searchEl.value.trim().toLowerCase();
    const visible = sessions.filter((s) => s.title.toLowerCase().includes(keyword));
    const allChecked = visible.length > 0 && visible.every((s) => selected.has(s.id));
    for (const s of visible) {
      if (allChecked) selected.delete(s.id);
      else selected.add(s.id);
    }
    renderList();
  });

  [fmtHtmlEl, fmtMdEl].forEach((el) => el.addEventListener("change", refreshFoot));

  exportBtn.addEventListener("click", async () => {
    if (exporting || selected.size === 0) return;
    const formats = [];
    if (fmtHtmlEl.checked) formats.push("html");
    if (fmtMdEl.checked) formats.push("markdown");
    if (formats.length === 0) return;

    exporting = true;
    resultEl.innerHTML = "";
    refreshFoot();

    let result;
    try {
      result = await invoke("export", { sessionIds: [...selected], formats });
    } catch (err) {
      result = { ok: false, error: `导出失败：${err.message}` };
    }

    exporting = false;
    refreshFoot();

    // 用户在选目录对话框点了取消，静默返回
    if (result.canceled) return;
    if (!result.ok) {
      resultEl.className = "result err";
      resultEl.textContent = result.error || "导出失败";
      return;
    }

    const parts = [];
    if (result.files.length > 0) {
      parts.push(`<div><strong>已导出 ${result.files.length} 个文件：</strong></div>`);
      for (const file of result.files) {
        parts.push(`<div class="file"><span title="${file.path}">${file.name}</span><button data-path="${file.path}">打开所在文件夹</button></div>`);
      }
    } else {
      parts.push("<div>没有生成任何文件</div>");
    }
    if (result.errors.length > 0) {
      parts.push(`<div style="margin-top:6px;color:var(--danger);"><strong>失败 ${result.errors.length} 项：</strong></div>`);
      for (const err of result.errors) {
        parts.push(`<div class="file"><span>${err.title}</span><span>${err.error}</span></div>`);
      }
    }
    resultEl.className = "result " + (result.errors.length === 0 ? "ok" : "err");
    resultEl.innerHTML = parts.join("");
  });

  // 打开导出文件所在目录（在资源管理器中定位）
  resultEl.addEventListener("click", (event) => {
    if (event.target.tagName === "BUTTON" && event.target.dataset.path) {
      shell.showItemInFolder(event.target.dataset.path);
    }
  });

  // 启动时拉取会话列表
  (async () => {
    let result;
    try {
      result = await invoke("list");
    } catch (err) {
      result = { ok: false, error: `读取存档失败：${err.message}` };
    }
    if (!result.ok) {
      listEl.innerHTML = `<div class="state error">${result.error}</div>`;
      return;
    }
    sessions = result.sessions;
    renderList();
  })();
</script>
</body>
</html>
